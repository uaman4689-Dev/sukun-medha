name: Community integration tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  community-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sukun_medha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sukun_medha_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - run: npm run test:community
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sukun_medha_test
          JWT_SECRET: community-ci-test-secret
