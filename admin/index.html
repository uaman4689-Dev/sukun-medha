<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUKUN MEDHA Admin</title><link rel="stylesheet" href="../style.css"><style>

grid;grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.panel{padding:16px}}
