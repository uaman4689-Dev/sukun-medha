<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Publisher — Admin</title><link rel="stylesheet" href="/style.css"><style>body{background:#f3f6f2}.wrap{max-width:1150px;margin:25px auto;padding:0 16px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.panel{background:white;border:1px solid #e1e9df;border-radius:16px;padding:20px;margin:16px 0}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form label{display:grid;gap:5px;font-size:12px;color:#607168}.form input,.form textarea,.form select{padding:11px;border:1px solid #dce5da;border-radius:9px;font:inherit;min-width:0}.form textarea{min-height:85px}.wide{grid-column:1/-1}.btn{border:0;border-radius:9px;padding:11px 16px;background:#0d5543;color:white;font-weight:700;cursor:pointer}.btn.alt{background:#edf2eb;color:#245b45}.list{display:grid;gap:9px}.item{display:flex;gap:12px;align-items:center;padding:11px;border:1px solid #e5ebe2;border-radius:11px}.item img{width:54px;height:70px;object-fit:cover;border-radius:6px}.item div{flex:1;min-width:0}.item small{display:block;color:#77857d}.item button{margin:3px}.status{font-size:12px;color:#6e7b72;white-space:pre-wrap}@media(max-width:600px){.form{grid-template-columns:1fr}.wide{grid-column:auto}.panel{padding:14px}.item{align-items:flex-start;flex-wrap:wrap}}</style></head><body><main class="wrap"><div class="head"><div><small>SUКUN MEDHA · PUBLISHING STUDIO</small><h1>📚 Book Publisher</h1><p>বই তৈরি, প্রকাশ, বিক্রি এবং Prize হিসেবে বিতরণ করুন।</p></div><a href="/admin" class="btn alt">Admin Dashboard</a></div><section class="panel"><h2 id="formTitle">নতুন বই Publish করুন</h2><form id="form" class="form"><input type="hidden" name="id"><label>বইয়ের নাম<input name="title" required maxlength="180"></label><label>লেখক<input name="author" maxlength="140"></label><label>Category<input name="category" placeholder="Islamic, Education, Story..."></label><label>Cover Image URL<input name="coverUrl" type="url" placeholder="https://..."></label><label class="wide">বইয়ের Description<textarea name="description" required maxlength="1200"></textarea></label><label>Access Type<select name="accessType"><option value="free">Free</option><option value="coin">Coin</option><option value="cash">Cash (৳)</option></select></label><label>Coin Price<input name="coinPrice" type="number" min="0" value="0"></label><label>Cash Price (৳)<input name="price" type="number" min="0" value="0"></label><label>Preview Pages<input name="previewPages" type="number" min="0" max="10" value="3"></label><label>Status<select name="status"><option>Draft</option><option>Published</option><option>Hidden</option></select></label><label>PDF Book Upload<input id="pdf" type="file" accept="application/pdf,.pdf"></label><div class="wide"><button class="btn">বই Save করুন</button> <button class="btn alt" type="button" id="reset">নতুন বই</button></div><p class="status wide" id="msg"></p></form></section><section class="panel"><h2>Published & Draft Books</h2><div id="list" class="list">লোড হচ্ছে…</div></section><section class="panel"><h2>Book Sales Report</h2><div id="report" class="list">লোড হচ্ছে…</div></section><section class="panel"><h2>Prize হিসেবে বই দিন</h2><form id="award" class="form"><label>বই নির্বাচন<select name="bookId" required id="awardBook"></select></label><label>Member Phone<input name="phone" required placeholder="01XXXXXXXXX"></label><div class="wide"><button class="btn">Prize Book Assign</button></div><p id="awardMsg" class="status wide"></p></form></section></main><script src="/admin/books.js"></script></body></html>
