<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificate Studio — SUKUN MEDHA</title><link rel="stylesheet" href="/style.css"><style>body{background:#f3f6f1}.wrap{max-width:1100px;margin:28px auto;padding:0 18px}.panel{background:white;border:1px solid #e3e9e2;border-radius:14px;padding:22px;margin:18px 0}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form label{display:grid;gap:6px;font-size:13px;color:#53645d}.form input,.form textarea{padding:11px;border:1px solid #dfe5de;border-radius:8px;font:14px 'Hind Siliguri'}.wide{grid-column:1/-1}.muted{font-size:13px;color:#7b8982}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:10px;border-bottom:1px solid #edf0eb;text-align:left}.act{border:0;border-radius:7px;padding:8px 10px;cursor:pointer;background:#eaf1e9;color:#073d3a}.danger{background:#fff0ef;color:#9d302b}@media(max-width:650px){.form{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="/"><span class="brand-mark">SM</span><span><b>SUKUN <i>MEDHA</i></b><small>CERTIFICATE STUDIO</small></span></a><a href="/admin">Admin Panel ↗</a></div></header><main class="wrap"><h1>Certificate Studio</h1><p class="muted">পরীক্ষা শেষে প্রাপকের তথ্য দিন। সিস্টেম Certificate Number ও Verification Link তৈরি করবে।</p><section class="panel"><h2>নতুন Certificate ইস্যু</h2><form id="issue" class="form"><label>প্রাপকের পূর্ণ নাম *<input name="recipientName" required maxlength="140" placeholder="যে নামে সার্টিফিকেট হবে"></label><label>পরীক্ষা / প্রতিযোগিতার নাম *<input name="examTitle" required maxlength="180" placeholder="যেমন: General Knowledge Assessment 2026"></label><label>প্রাপকের মোবাইল (ঐচ্ছিক)<input name="recipientPhone" placeholder="Member account থাকলে যুক্ত হবে"></label><label>ইমেইল (ঐচ্ছিক)<input name="recipientEmail" type="email"></label><label>স্কোর / নম্বর<input name="score" placeholder="যেমন: ৮৫/১০০"></label><label>গ্রেড / অবস্থান<input name="grade" placeholder="যেমন: A+ / ১ম স্থান"></label><label class="wide">অর্জন / বিবরণ<input name="achievement" value="সফলভাবে পরীক্ষা সম্পন্ন করেছেন"></label><label>ইস্যুর তারিখ<input name="issueDate" type="date" required></label><label>প্রতিষ্ঠান<input name="organization" value="SUKUN MEDHA"></label><label>অনুমোদনকারীর নাম<input name="issuerName" value="SUKUN MEDHA"></label><label>পদবি<input name="issuerTitle" value="Authorized Signatory"></label><div class="wide"><button class="btn btn-gold">Certificate তৈরি ও ইস্যু করুন ↗</button></div></form><p id="msg" class="muted"></p></section><section class="panel"><h2>ইস্যু করা Certificate</h2><div id="records">লোড হচ্ছে…</div></section></main><script src="/admin/certificates.js"></script></body></html>
