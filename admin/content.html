<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUKUN MEDHA · Content Studio</title><link rel="stylesheet" href="/style.css"><style>
body{background:#f5f7f2;color:#183d35}.studio-head{background:#073d3a;color:#fff;padding:18px 0}.studio-head .container{display:flex;align-items:center;justify-content:space-between;gap:15px}.studio{max-width:1120px;margin:28px auto;padding:0 18px}.studio-panel{background:#fff;border:1px solid #e4eae2;border-radius:16px;padding:24px;margin-bottom:18px}.studio-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.studio-tabs button,.soft{border:1px solid #dfe7dd;background:#fff;padding:10px 14px;border-radius:9px;cursor:pointer;color:#28564a;font-weight:700}.studio-tabs button.active{background:#073d3a;color:#fff}.editor{display:grid;grid-template-columns:1fr 1fr;gap:12px}.editor label{display:grid;gap:6px;font-size:13px;color:#63746c}.editor input,.editor select,.editor textarea{padding:11px;border:1px solid #dfe5de;border-radius:8px;font:14px 'Hind Siliguri',sans-serif;width:100%}.editor .wide{grid-column:1/-1}.editor textarea{min-height:90px}.primary{background:#0b5b4e;color:#fff;border:0;padding:12px 18px;border-radius:9px;cursor:pointer;font-weight:700}.records{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.record{border:1px solid #e6ebe4;border-radius:10px;padding:14px}.record p{font-size:13px;color:#77847d}.record-actions{display:flex;gap:8px}.record-actions button{border:0;padding:7px 10px;border-radius:7px;cursor:pointer}.danger{background:#fff0ed;color:#a43e35}.notice{color:#7b8982;font-size:13px}.hidden{display:none!important}@media(max-width:650px){.editor,.records{grid-template-columns:1fr}.studio-panel{padding:16px}}
</style></head><body><header class="studio-head"><div class="container"><div><b>SUKUN MEDHA · CONTENT STUDIO</b><small style="display:block;color:#c8d8d0">Learn · Competition · Challenge · Rewards · Offers</small></div><a class="btn btn-gold" href="/admin">← Admin Panel</a></div></header><main class="studio"><section class="studio-panel"><h1>Content Manager</h1><p class="notice">এখানে তৈরি করা Published কনটেন্ট Home Page-এ দেখা যাবে। Competition-এর প্রশ্ন সেই Competition-এর সঙ্গেই সংরক্ষিত হবে।</p><div class="studio-tabs" id="tabs"><button data-type="courses" class="active">Learn / Course</button><button data-type="competitions">Competition</button><button data-type="challenges">Challenge</button><button data-type="rewards">Gift & Reward</button><button data-type="offers">Offers</button></div><form id="editor" class="editor"><input type="hidden" name="id"><label>নাম / শিরোনাম<input name="title" required maxlength="140"></label><label>ধরন / Category<input name="category" placeholder="যেমন: Science, Islamic Knowledge"></label><label class="wide">বিবরণ<textarea name="description" required></textarea></label><label>নিয়মিত মূল্য (৳)<input name="price" type="number" min="0" value="0"></label><label>Entry Fee (৳)<input name="fee" type="number" min="0" value="0"></label><label>Coin Price<input name="coinPrice" type="number" min="0" value="0"></label><label>পুরস্কারের পরিমাণ / Quantity<input name="quantity" placeholder="যেমন: ৩টি Gift"></label><label>Offer Code / Discount<input name="code" placeholder="যেমন: SUKUN20"></label><label>Offer Text<input name="discountText" placeholder="যেমন: ২০% ছাড়"></label><label>শুরু<input name="startDate" type="date"></label><label>শেষ<input name="endDate" type="date"></label><label>Status<select name="status"><option>Draft</option><option>Published</option><option>Paused</option><option>Closed</option></select></label><label>Access Type<select name="accessType"><option value="free">Free</option><option value="paid">Paid</option><option value="coin">Coin</option><option value="subscription">Subscription</option></select></label><label class="wide">Competition Questions (শুধু Competition-এর জন্য JSON)<textarea name="questions" placeholder='[{"question":"বাংলাদেশের জাতীয় ফুল কী?","type":"mcq","options":["শাপলা","গোলাপ"],"answer":"শাপলা","marks":1}]'></textarea></label><label class="wide">ছবির URL<input name="imageUrl" type="url" placeholder="https://..."></label><div class="wide"><button class="primary" type="submit">সংরক্ষণ করুন</button> <button class="soft" type="button" id="reset">নতুন আইটেম</button><span id="msg" class="notice"></span></div></form></section><section class="studio-panel"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><h2 id="listTitle">Learn / Course তালিকা</h2><span class="notice" id="count"></span></div><div id="records" class="records"></div></section></main><script src="/admin/content.js"></script></body></html>
