<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payments Admin — SUKUN MEDHA</title><link rel="stylesheet" href="/style.css"><style>body{background:#f4f6f2}.wrap{max-width:1150px;margin:28px auto;padding:0 18px}.panel{background:#fff;border:1px solid #e4e9e2;border-radius:12px;padding:20px;margin:16px 0}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.form label{display:grid;gap:5px;font-size:13px}.form input,.form select,.form textarea{padding:10px;border:1px solid #dce4dc;border-radius:7px}.wide{grid-column:1/-1}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:10px;border-bottom:1px solid #edf0eb}.action{padding:7px 10px;border:0;border-radius:6px;cursor:pointer;background:#eaf2eb;color:#073d3a}.reject{background:#fff0ef;color:#a33}.muted{color:#718078;font-size:13px}@media(max-width:750px){.form{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="/admin"><span class="brand-mark">SM</span><span><b>SUKUN <i>MEDHA</i></b><small>PAYMENT CONTROL</small></span></a><a href="/admin">Admin Panel ↗</a></div></header><main class="wrap"><h1>Subscription & Manual Payment</h1><p class="muted">প্যাকেজ তৈরি করুন, পেমেন্ট নম্বর সেট করুন এবং Transaction ID যাচাই করে Access চালু করুন।</p><section class="panel"><h2>পেমেন্ট গ্রহণের তথ্য</h2><form id="settings" class="form"><label>bKash নম্বর<input name="bkash"></label><label>Nagad নম্বর<input name="nagad"></label><label>Rocket নম্বর<input name="rocket"></label><label>Bank / Account তথ্য<input name="bank"></label><label class="wide">পেমেন্ট নির্দেশনা<textarea name="instructions"></textarea></label><div class="wide"><button class="btn btn-gold">তথ্য সংরক্ষণ</button></div></form></section><section class="panel"><h2>নতুন Subscription / Exam Pass</h2><form id="package" class="form"><label>প্যাকেজের নাম<input name="name" required></label><label>ধরন<select name="kind"><option value="monthly">Monthly Subscription</option><option value="yearly">Yearly Subscription</option><option value="custom">Custom Subscription</option><option value="exam">একটি Exam Pass</option><option value="competition">একটি Competition Pass</option><option value="book">Book / PDF</option><option value="course">Course</option></select></label><label>মেয়াদ (দিন)<input name="durationDays" type="number" min="1" value="30" required></label><label>মূল্য (৳)<input name="price" type="number" min="0" step=".01" required></label><label>Offer Price (ঐচ্ছিক)<input name="offerPrice" type="number" min="0" step=".01"></label><label>Target ID (Exam/Competition/Book/Course)<input name="targetId"></label><label>Target Type<input name="targetType" value="membership"></label><label class="wide">বিবরণ<input name="description"></label><label class="wide">সুবিধাসমূহ (প্রতি লাইনে একটি)<textarea name="features" rows="3"></textarea></label><div class="wide"><button class="btn btn-gold">প্যাকেজ তৈরি করুন</button></div></form><div id="packages"></div></section><section class="panel"><h2>Offer / Discount তৈরি</h2><form id="offer" class="form"><label>Offer নাম<input name="title" required></label><label>Coupon Code (ঐচ্ছিক)<input name="code"></label><label>Discount Type<select name="discountType"><option value="percent">Percent %</option><option value="fixed">Fixed ৳</option></select></label><label>Discount Value<input name="discountValue" type="number" min="1" step=".01" required><small class="muted">Percent সর্বোচ্চ ১০০%; Fixed Discount টাকার অঙ্কে</small></label><label>শুরু<input name="startsAt" type="datetime-local"></label><label>শেষ<input name="endsAt" type="datetime-local"></label><label class="wide">বিবরণ<input name="description"></label><div class="wide"><button class="btn btn-gold">Offer সংরক্ষণ</button></div></form><div id="offers"></div></section><section class="panel"><h2>Pending / Payment Verification</h2><div id="payments">লোড হচ্ছে…</div></section><p id="msg" class="muted"></p></main><script src="/admin/payments.js"></script></body></html>
