services:
  - type: web
    name: sukun-medha
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sukun-medha-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: sukun-medha-db
    plan: basic-256mb
    databaseName: sukunmedha
    user: sukunmedha