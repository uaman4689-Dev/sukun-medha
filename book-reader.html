<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Reader — SUKUN MEDHA</title><link rel="stylesheet" href="/style.css"><style>body{background:#eef1eb}.top{position:sticky;top:0;z-index:5;background:#073d3a;color:#fff;padding:12px 18px;display:flex;justify-content:space-between;gap:10px;align-items:center}.top a{color:#f0d99c}.reader-nav{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}.reader-nav a{font-size:13px;text-decoration:none;padding:7px 10px;border:1px solid #ffffff44;border-radius:8px}.reader-nav a:hover{background:#ffffff18}.layout{max-width:1150px;margin:20px auto;padding:0 14px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px}.side,.paper{background:white;border:1px solid #e2e8df;border-radius:15px;padding:18px}.side{height:max-content;position:sticky;top:75px}.side h1{font-size:20px;color:#173e33}.side p{font-size:12px;color:#758178;line-height:1.7}.progress{height:7px;background:#edf1eb;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:#b99a58;width:0}.paper{min-height:70vh;padding:clamp(20px,5vw,55px);box-shadow:0 10px 30px #1d3d2810}.kicker{font-size:10px;letter-spacing:2px;color:#a08043;font-weight:800}.paper h2{color:#173e33;margin:12px 0 25px}.content{font-size:18px;line-height:2.05;color:#293d34;white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:30px}.actions button{border:0;border-radius:9px;padding:10px 14px;background:#0d5543;color:white;font:700 13px inherit;cursor:pointer}.actions button:disabled{opacity:.4}.actions .alt{background:#edf2eb;color:#285b45}.pages{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}.pages button{border:1px solid #dce5d9;background:white;border-radius:9px;padding:10px 14px}.mark{margin-top:18px;padding:13px;border:1px solid #e5ebe2;border-radius:10px}.marks{font-size:12px;color:#6d7a72}.error{padding:30px;background:white;border-radius:14px}@media(max-width:760px){.layout{grid-template-columns:1fr}.side{position:static}.content{font-size:16px;line-height:1.9}.side h1{margin:0 0 5px}}</style></head><body><header class="top"><b>📖 SUKUN MEDHA Reader</b><nav class="reader-nav"><a href="/">⌂ Homepage</a><a href="/member.html">Member ID</a><a href="/my-books">My Books</a><a href="/books">Book Store</a></nav></header><main class="layout"><aside class="side"><h1 id="title">বই লোড হচ্ছে…</h1><p id="author"></p><p id="progressText">Reading Progress · 0%</p><div class="progress"><span id="progress"></span></div><p id="pageCount"></p><p>আপনার পড়ার অগ্রগতি স্বয়ংক্রিয়ভাবে Save হবে।</p></aside><article class="paper"><div class="kicker">SUKUN MEDHA · DIGITAL LIBRARY</div><h2 id="pageTitle">পৃষ্ঠা ১</h2><div id="content" class="content"></div><div class="actions"><button id="bookmark" class="alt">☆ Bookmark</button><button id="smaller" class="alt">A−</button><button id="larger" class="alt">A+</button><button id="theme" class="alt">☾ Reading Mode</button></div><div id="marks" class="marks"></div><div class="pages"><button id="prev">← আগের পৃষ্ঠা</button><b id="pageNo"></b><button id="next">পরের পৃষ্ঠা →</button></div><p id="msg" class="marks"></p></article></main><script src="/book-reader.js?v=4"></script></body></html>
