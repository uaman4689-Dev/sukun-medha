<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course Purchase · SUKUN MEDHA</title><link rel="stylesheet" href="/style.css"><style>
body{background:#f5f7f2;color:#193b31}.buy-wrap{max-width:760px;margin:34px auto;padding:0 16px}.buy-panel{background:#fff;border:1px solid #e3eae2;border-radius:16px;padding:24px;margin:14px 0;box-shadow:0 8px 28px #193b310b}.buy-course{display:flex;gap:16px;align-items:center}.buy-course img{width:120px;aspect-ratio:16/10;object-fit:cover;border-radius:10px;background:#edf2ec}.buy-course h1{font-size:21px;margin:0 0 6px}.buy-tabs{display:flex;gap:8px;margin-bottom:18px}.buy-tabs button{border:1px solid #dce5dc;background:#f3f7f2;padding:10px 15px;border-radius:8px;cursor:pointer}.buy-tabs button.active{background:#145b3c;color:white}.buy-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.buy-form label{display:grid;gap:5px;font-size:13px}.buy-form input{padding:12px;border:1px solid #dce5dd;border-radius:8px}.buy-form .wide{grid-column:1/-1}.buy-btn{background:#145b3c;color:#fff;border:0;border-radius:9px;padding:12px 18px;font-weight:700;cursor:pointer}.buy-btn:disabled{opacity:.6}.buy-note{font-size:13px;color:#75837b}.hidden{display:none!important}@media(max-width:600px){.buy-form{grid-template-columns:1fr}.buy-form .wide{grid-column:auto}.buy-course img{width:88px}.buy-panel{padding:17px}}
</style></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="/"><span class="brand-mark">SM</span><span><b>SUKUN <i>MEDHA</i></b><small>COURSE PURCHASE</small></span></a><a href="/">Home ↗</a></div></header><main class="buy-wrap"><section class="buy-panel"><div id="product">কোর্সের তথ্য লোড হচ্ছে...</div></section><section class="buy-panel"><div id="signedIn" class="hidden"><h2>আপনি লগইন করেছেন</h2><p id="signedName"></p><button class="buy-btn" id="continueBuy">Cart-এ নিয়ে যান ↗</button></div><div id="authBox"><div class="buy-tabs"><button type="button" class="active" data-mode="login">আগে Account আছে? Login</button><button type="button" data-mode="register">নতুন? Member Account খুলুন</button></div><form id="loginForm" class="buy-form"><label class="wide">মোবাইল নম্বর / Email<input name="identity" required autocomplete="username"></label><label class="wide">Password<input name="password" type="password" required autocomplete="current-password"></label><div class="wide"><button class="buy-btn">Login করে কিনুন</button></div></form><form id="registerForm" class="buy-form hidden"><label>আপনার নাম<input name="name" required autocomplete="name"></label><label>মোবাইল নম্বর<input name="phone" required inputmode="tel" autocomplete="tel"></label><label class="wide">Email (ঐচ্ছিক)<input name="email" type="email" autocomplete="email"></label><label class="wide">Password (কমপক্ষে ৮ অক্ষর)<input name="password" type="password" minlength="8" required autocomplete="new-password"></label><div class="wide"><button class="buy-btn">Account খুলে কিনুন</button></div></form></div><p id="buyMessage" class="buy-note">অর্ডার ও Course Access সংরক্ষণের জন্য Member Account প্রয়োজন।</p></section></main><script src="/buy.js"></script></body></html>
