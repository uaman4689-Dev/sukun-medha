<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subscription & Payment — SUKUN MEDHA</title><link rel="stylesheet" href="/style.css"><style>body{background:#f4f6f2}.wrap{max-width:1050px;margin:35px auto;padding:0 18px}.panel{background:white;border:1px solid #e3e9e2;border-radius:14px;padding:22px;margin:18px 0}.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.plan{border:1px solid #e1e8df;border-radius:12px;padding:18px}.plan h3{margin:8px 0}.price{font:800 26px Manrope;color:#073d3a}.muted{color:#718078;font-size:13px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form label{display:grid;gap:6px}.form input,.form select,.form textarea{padding:11px;border:1px solid #dce4dc;border-radius:8px;font:14px 'Hind Siliguri'}.form .wide{grid-column:1/-1}.status{font-weight:700}.row{padding:12px 0;border-bottom:1px solid #edf0eb}@media(max-width:650px){.form{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="/"><span class="brand-mark">SM</span><span><b>SUKUN <i>MEDHA</i></b><small>LEARN · COMPETE · ACHIEVE</small></span></a><a href="/member.html">সদস্য ড্যাশবোর্ড ↗</a></div></header><main class="wrap"><h1>সাবস্ক্রিপশন ও পেমেন্ট</h1><p class="muted">প্যাকেজ কিনতে টাকা পাঠিয়ে Transaction ID জমা দিন। Admin যাচাই না করা পর্যন্ত Access চালু হবে না।</p><section class="panel"><h2>প্যাকেজ নির্বাচন করুন</h2><div id="offers" class="muted"></div><div id="plans" class="plans">লোড হচ্ছে…</div></section><section class="panel"><h2>Manual Payment জমা দিন</h2><div id="payInfo" class="muted"></div><form id="payForm" class="form"><label>নির্বাচিত প্যাকেজ<select name="packageId" id="packageId" required></select></label><label>পেমেন্ট মাধ্যম<select name="method"><option>bKash</option><option>Nagad</option><option>Rocket</option><option>Bank</option></select></label><label>Transaction ID<input name="transactionId" required maxlength="120"></label><label>যে নম্বর থেকে টাকা পাঠিয়েছেন<input name="payerPhone" required></label><label>Coupon Code (ঐচ্ছিক)<input name="offerCode" id="offerCode"></label><label>টাকার পরিমাণ<input name="amount" id="amount" type="number" min="0" step="0.01" required></label><label class="wide">নোট (ঐচ্ছিক)<textarea name="note" rows="2"></textarea></label><div class="wide"><button class="btn btn-gold">পেমেন্ট তথ্য জমা দিন ↗</button></div></form><p id="msg" class="muted"></p></section><section class="panel"><h2>আমার পেমেন্ট ও Access</h2><div id="history" class="muted">লোড হচ্ছে…</div></section></main><script src="/payments.js"></script></body></html>
